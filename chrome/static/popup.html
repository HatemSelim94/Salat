<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Salat</title>
  <link rel="stylesheet" href="salat.css">
</head>
<body class="popup">
  <header>
    <a href="#" class="loc" id="location-link"><span id="pin"></span><h1 id="location">Salat</h1></a>
    <div class="date"><div id="hijri"></div><div id="gregorian"></div></div>
  </header>
  <div class="ramadan" id="ramadan" hidden>
    <div class="label" data-i18n="home.ramadan">Ramadan</div>
    <div class="row"><span class="name" id="ramadan-name"></span><span class="time" id="ramadan-time"></span></div>
  </div>
  <div class="next" id="next">
    <div class="row">
      <div>
        <div class="label" data-i18n="home.nextPrayer">Next prayer</div>
        <div class="name" id="next-name">—</div>
        <div class="in" id="next-in"></div>
      </div>
      <div class="big-glyph" id="next-glyph"></div>
    </div>
    <div id="progress"></div>
  </div>
  <ul class="times" id="times"></ul>
  <div class="notice" id="notice" hidden></div>
  <footer>
    <span class="meta"><span class="muted" id="method"></span><span class="muted" id="qibla"></span></span>
    <span class="links">
      <a href="#" id="open-month"><span class="ico" id="ico-month"></span><span data-i18n="home.month">Month</span></a>
      <a href="#" id="open-options"><span class="ico" id="ico-settings"></span><span data-i18n="home.settings">Settings</span></a>
    </span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>

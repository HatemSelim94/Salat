<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Salat – Settings</title>
  <link rel="stylesheet" href="salat.css">
</head>
<body class="options">
  <h1>Salat</h1>
  <p class="lead" data-i18n="settings.lead">Everything is calculated on this device. Nothing is sent anywhere.</p>

  <section>
    <h2 data-i18n="settings.location">Location</h2>
    <div class="city">
      <input id="city" type="text" data-i18n-placeholder="settings.searchCity" placeholder="Search a city…" autocomplete="off" spellcheck="false">
      <ul id="city-results" role="listbox"></ul>
    </div>
    <div class="coords">
      <label><span data-i18n="settings.latitude">Latitude</span> <input id="lat" type="number" step="0.01" min="-90" max="90"></label>
      <label><span data-i18n="settings.longitude">Longitude</span> <input id="lng" type="number" step="0.01" min="-180" max="180"></label>
      <label><span data-i18n="settings.timezone">Time zone</span> <input id="tz" type="text" placeholder="Europe/Berlin"></label>
    </div>
    <div class="status" id="location-status"></div>
  </section>

  <section>
    <h2 data-i18n="settings.calculation">Calculation</h2>
    <div class="field">
      <label for="method"><span data-i18n="settings.method">Method</span><div class="hint" data-i18n="settings.methodHint">Use what your local mosque or country authority uses.</div></label>
      <select id="method"></select>
    </div>
    <div class="field">
      <label for="madhab"><span data-i18n="settings.asr">Asr</span><div class="hint" data-i18n="settings.asrHint">Hanafi gives a later Asr.</div></label>
      <select id="madhab">
        <option value="shafi" data-i18n="settings.asrStandard">Standard (Shafi, Maliki, Hanbali)</option>
        <option value="hanafi" data-i18n="settings.asrHanafi">Hanafi</option>
      </select>
    </div>
    <div class="field">
      <label for="hlr"><span data-i18n="settings.highLatRule">High-latitude rule</span><div class="hint" data-i18n="settings.highLatHint">Matters north of ~48° in summer, when twilight never ends.</div></label>
      <select id="hlr"></select>
    </div>
    <div class="field" style="display:block">
      <label><span data-i18n="settings.adjustments">Adjustments (minutes)</span><div class="hint" data-i18n="settings.adjustmentsHint">Shift individual prayers to match a local timetable.</div></label>
      <div class="adjust" id="adjust" style="margin-top:8px"></div>
    </div>
    <div class="field" style="display:block">
      <div class="hint" style="margin-bottom:6px" data-i18n="settings.preview">Today with these settings</div>
      <div class="preview" id="preview"></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="settings.reminders">Reminders</h2>
    <div class="field">
      <label for="enabled" data-i18n="settings.notify">Notify at prayer times</label>
      <label class="toggle"><input id="enabled" type="checkbox"><span></span></label>
    </div>
    <div class="field">
      <label for="pre"><span data-i18n="settings.preReminder">Heads-up before each prayer</span><div class="hint" data-i18n="settings.preReminderHint">0 turns it off.</div></label>
      <span><input id="pre" type="number" min="0" max="60" step="5"> min</span>
    </div>
    <div class="field">
      <label for="sound"><span data-i18n="settings.chime">Play a short chime</span><div class="hint" data-i18n="settings.chimeHint">A quiet tone, not an adhan recording.</div></label>
      <label class="toggle"><input id="sound" type="checkbox"><span></span></label>
    </div>
    <div class="field">
      <label for="snooze" data-i18n="settings.snooze">Snooze length</label>
      <span><input id="snooze" type="number" min="1" max="60"> min</span>
    </div>
    <div class="field">
      <label for="badge" data-i18n="settings.badge">Show next prayer on the toolbar icon</label>
      <label class="toggle"><input id="badge" type="checkbox"><span></span></label>
    </div>
    <div class="field">
      <label for="language" data-i18n="settings.language">Language</label>
      <select id="language"></select>
    </div>
    <div class="field">
      <label for="hour12" data-i18n="settings.hour12">12-hour clock</label>
      <label class="toggle"><input id="hour12" type="checkbox"><span></span></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn secondary" id="test" data-i18n="settings.testNotification">Send a test notification</button>
      <span class="status" id="save-status"></span>
    </div>
  </section>

  <p class="muted" style="font-size:12px" id="footer"></p>
  <script type="module" src="options.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Salat – Settings</title>
  <link rel="stylesheet" href="salat.css">
</head>
<body class="options">
  <h1>Salat</h1>
  <p class="lead">Everything is calculated on this device. Nothing is sent anywhere.</p>

  <section>
    <h2>Location</h2>
    <div class="city">
      <input id="city" type="text" placeholder="Search a city…" autocomplete="off" spellcheck="false">
      <ul id="city-results" role="listbox"></ul>
    </div>
    <div class="coords">
      <label>Latitude <input id="lat" type="number" step="0.01" min="-90" max="90"></label>
      <label>Longitude <input id="lng" type="number" step="0.01" min="-180" max="180"></label>
      <label>Time zone <input id="tz" type="text" placeholder="Europe/Berlin"></label>
    </div>
    <div class="status" id="location-status"></div>
  </section>

  <section>
    <h2>Calculation</h2>
    <div class="field">
      <label for="method">Method<div class="hint">Use what your local mosque or country authority uses.</div></label>
      <select id="method"></select>
    </div>
    <div class="field">
      <label for="madhab">Asr<div class="hint">Hanafi gives a later Asr.</div></label>
      <select id="madhab">
        <option value="shafi">Standard (Shafi, Maliki, Hanbali)</option>
        <option value="hanafi">Hanafi</option>
      </select>
    </div>
    <div class="field">
      <label for="hlr">High-latitude rule<div class="hint">Matters north of ~48° in summer, when twilight never ends.</div></label>
      <select id="hlr"></select>
    </div>
    <div class="field" style="display:block">
      <label>Adjustments (minutes)<div class="hint">Shift individual prayers to match a local timetable.</div></label>
      <div class="adjust" id="adjust" style="margin-top:8px"></div>
    </div>
    <div class="field" style="display:block">
      <div class="hint" style="margin-bottom:6px">Today with these settings</div>
      <div class="preview" id="preview"></div>
    </div>
  </section>

  <section>
    <h2>Reminders</h2>
    <div class="field">
      <label for="enabled">Notify at prayer times</label>
      <label class="toggle"><input id="enabled" type="checkbox"><span></span></label>
    </div>
    <div class="field">
      <label for="pre">Heads-up before each prayer<div class="hint">0 turns it off.</div></label>
      <span><input id="pre" type="number" min="0" max="60" step="5"> min</span>
    </div>
    <div class="field">
      <label for="sound">Play a short chime<div class="hint">A quiet tone, not an adhan recording.</div></label>
      <label class="toggle"><input id="sound" type="checkbox"><span></span></label>
    </div>
    <div class="field">
      <label for="snooze">Snooze length</label>
      <span><input id="snooze" type="number" min="1" max="60"> min</span>
    </div>
    <div class="field">
      <label for="badge">Show next prayer on the toolbar icon</label>
      <label class="toggle"><input id="badge" type="checkbox"><span></span></label>
    </div>
    <div class="field">
      <label for="hour12">12-hour clock</label>
      <label class="toggle"><input id="hour12" type="checkbox"><span></span></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn secondary" id="test">Send a test notification</button>
      <span class="status" id="save-status"></span>
    </div>
  </section>

  <p class="muted" style="font-size:12px">Salat is free and open source (MIT) · <a href="https://github.com/HatemSelim94/salat" target="_blank" rel="noopener">GitHub</a></p>
  <script type="module" src="options.js"></script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used by the release job on tags

env:
  QT_VERSION: "6.8.3"

jobs:
  # ---- core + Chrome + VS Code ----------------------------------------------
  web:
    name: core / chrome / vscode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test -w core
      - run: npm test -w vscode
      - name: Package Chrome extension
        run: cd chrome && zip -qr ../salat-chrome.zip dist
      - name: Package VS Code extension
        run: cd vscode && npx vsce package --no-dependencies -o ../salat-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: salat-chrome
          path: salat-chrome.zip
      - uses: actions/upload-artifact@v4
        with:
          name: salat-vscode
          path: salat-vscode.vsix

  # ---- Qt desktop app on all three OSes ------------------------------------
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 for the AppImage: an AppImage runs on any distro with a glibc at least as new as the build host's.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev libegl1 libfontconfig1 libfuse2

      # macOS 15 SDK (Xcode 16) dropped the AGL framework; Qt 6.8 binaries still link it. 6.9 is built against the new SDK.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ runner.os == 'macOS' && '6.9.*' || env.QT_VERSION }}
          cache: true

      - name: Strip legacy AGL references (macOS)
        if: runner.os == 'macOS'
        run: |
          files=$(grep -rl 'AGL' "$QT_ROOT_DIR/lib/cmake" || true)
          for f in $files; do sed -i '' -e 's/-framework AGL//g; s/;AGL//g; s/AGL;//g' "$f"; done
          echo "patched: ${files:-nothing}"

      - name: Configure
        run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build desktop/build --config Release --parallel
      - name: Test (C++ port vs core vectors)
        run: ctest --test-dir desktop/build -C Release --output-on-failure

      # Smoke-run offscreen so a QML error fails the build instead of the user.
      - name: Smoke run (Linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./desktop/build/salat --light --screenshot screenshot-linux.png && test -s screenshot-linux.png

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/salat | Out-Null
          Copy-Item desktop/build/Release/salat.exe dist/salat/
          windeployqt --release --qmldir desktop/qml --no-translations --no-opengl-sw dist/salat/salat.exe
          Compress-Archive -Path dist/salat/* -DestinationPath salat-windows-x64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt desktop/build/salat.app -qmldir=desktop/qml -dmg
          mv desktop/build/salat.dmg salat-macos.dmg

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/desktop/qml
          EXTRA_PLATFORM_PLUGINS: libqwayland-generic.so;libqwayland-egl.so
          LINUXDEPLOY_OUTPUT_VERSION: ${{ github.ref_name }}
          NO_STRIP: "1"
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          cmake --install desktop/build --prefix AppDir/usr
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/salat.desktop \
            --icon-file desktop/resources/icons/icon256.png --icon-filename salat
          mv Salat*.AppImage salat-linux-x86_64.AppImage 2>/dev/null || mv salat*.AppImage salat-linux-x86_64.AppImage
          chmod +x salat-linux-x86_64.AppImage
          # Smoke-run the AppImage itself (extracted; FUSE is not needed that way).
          ./salat-linux-x86_64.AppImage --appimage-extract >/dev/null
          QT_QPA_PLATFORM=offscreen ./squashfs-root/AppRun --light --screenshot screenshot-appimage.png && test -s screenshot-appimage.png

      - uses: actions/upload-artifact@v4
        with:
          name: salat-desktop-${{ runner.os }}
          path: |
            salat-windows-x64.zip
            salat-macos.dmg
            salat-linux-x86_64.AppImage
            screenshot-linux.png
          if-no-files-found: error

  # ---- Android --------------------------------------------------------------
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests (Kotlin port vs core vectors)
        run: gradle -p android :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Lint
        run: gradle -p android :app:lintDebug --no-daemon
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: salat-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  # ---- GitHub Release on tags -----------------------------------------------
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.zip' -o -name '*.vsix' -o -name '*.dmg' -o -name '*.apk' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Unsigned builds — see the README for the one-time warning on Windows (SmartScreen → Run anyway) and macOS (System Settings → Privacy & Security → Open Anyway).
